<!-- 대부분의 웹서버가 디폴트로 index.html 파일을 찾습니다. 
 ㄴ 인덱스라는 말은 영어로 "첫번째"를 의미합니다.-->

<!-- 먼저 시작하기전 준비해야 할 것들을 확인합니다.
 1. 우하단 html로 설정 되어있는지 확인 
 2. 우하단 prettier 확인 

 [단축키]
 1. ! + 엔터: 기본 HTML 구조 생성
 2. Ctrl + S: 저장 
 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Kokoa Talk</title>
</head>
<body>
    <div id="status-bar"> 
        <!-- 상태 표시줄 : 총 3개의 열(column)을 가짐
         클래스 이름을 아래처럼 길게 짓는 이유는 그냥 cloumn이라 지으면
         다른 곳에서 충돌할 수 있기 때문입니다. 이걸 BEM(Block Element Modifier) 방식이라고 합니다.

        - BEM(Block Element Modifier) 방식: 
        클래스 이름을 블록(Block), 요소(Element), 수정자(Modifier)로 나누어 작성하는 방식입니다.
        
        - 규칙 -
        `Block__Element--Modifier` 형태로 작성한다.  
        `__`는 블록 안의 요소, `--`는 기존 블록/요소의 변형 버전을 뜻한다.  
        예: `status-bar__column`, `button--danger`
        -->

        <div class="status-bar__column">
            <span>No Service</span>
            <!-- 할일(To Do) : Wifi icon 
             hero icon에서 복사해서 쓰면됨 -->
             <!--
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 0 1 1.06 0Z" />
            </svg> 
             -->
            <!-- svg는 픽셀이 아닌 path로 좌표 되어있는 이미지 -->
            <i class="fa-solid fa-wifi"></i>
        </div>

        <div class="status-bar__column">
            <span>18:43</span>
        </div>

        <div class="status-bar__column">
            <span>110%</span>
            <!-- 할일(To Do) : Battery icon -->
            <!-- 할일(To Do) : Lightning(충전) icon 추가 -->
            <i class="fa-solid fa-battery-full"></i>
            <i class="fa-solid fa-bolt"></i>
        </div>
    </div>
    <script 
        src="https://kit.fontawesome.com/343146c1ba.js" 
        crossorigin="anonymous">

    </script>
    <!-- Font Awesome 아이콘 사용을 위한 스크립트
     ㄴ 스크립트는 항상 body 태그를 닫기 직전 마지막에 있어야함 -->

</body>
</html>
